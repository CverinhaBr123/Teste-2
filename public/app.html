<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão de Técnicos e Materiais</title>
    <!-- Importar o arquivo de configuração global -->
    <script src="config.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #43cea2 0%, #185a9d 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .loader-container {
            text-align: center;
            color: white;
        }
        
        .loader {
            border: 6px solid rgba(255, 255, 255, 0.3);
            border-top: 6px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 2s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .message {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            max-width: 80%;
            margin-top: 30px;
            text-align: center;
        }
        
        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="loader"></div>
        <h2>Carregando o sistema...</h2>
    </div>
    
    <div class="message" id="errorMessage" style="display: none;">
        <h3>Não foi possível carregar o sistema</h3>
        <p>Ocorreu um erro ao tentar carregar a página principal.</p>
        <a href="index.html" class="button">Voltar para a página inicial</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Verificar se o site está online
            if (!navigator.onLine) {
                document.getElementById('errorMessage').style.display = 'block';
                return;
            }
            
            // Obter a URL base e o caminho da página principal
            const baseUrl = window.SITE_CONFIG.baseUrl;
            const mainPath = "index.html"; // Página principal do sistema
            
            // Redirecionar para a página principal
            setTimeout(function() {
                try {
                    window.location.href = baseUrl + mainPath;
                } catch (error) {
                    console.error("Erro ao redirecionar:", error);
                    document.getElementById('errorMessage').style.display = 'block';
                }
            }, 1500);
        });
    </script>
</body>
</html>
