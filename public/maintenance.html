<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Em Manutenção - Sistema de Gestão de Técnicos e Materiais</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #43cea2 0%, #185a9d 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        
        .container {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            color: #333;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #3b82f6;
        }
        
        .icon {
            font-size: 5rem;
            margin-bottom: 20px;
            color: #3b82f6;
        }
        
        p {
            margin: 15px 0;
            font-size: 1.1rem;
            line-height: 1.5;
        }
        
        .progress-container {
            width: 100%;
            background-color: #e5e7eb;
            border-radius: 10px;
            margin: 30px 0;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 10px;
            background-color: #3b82f6;
            width: 75%;
            animation: progress 2s ease-in-out infinite alternate;
        }
        
        @keyframes progress {
            0% { width: 30%; }
            100% { width: 70%; }
        }
        
        .estimated-time {
            font-weight: bold;
            color: #4b5563;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🛠️</div>
        <h1>Site em Manutenção</h1>
        <p>Estamos realizando melhorias no sistema para proporcionar uma melhor experiência.</p>
        <p>Por favor, volte mais tarde. Agradecemos sua compreensão.</p>
        
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
        
        <p class="estimated-time">Tempo estimado para conclusão: <span id="countdown">30 minutos</span></p>
    </div>

    <script>
        // Configurar um contador regressivo (opcional)
        function startCountdown(minutes) {
            let totalSeconds = minutes * 60;
            const countdownElement = document.getElementById('countdown');
            
            const interval = setInterval(function() {
                totalSeconds--;
                
                if (totalSeconds <= 0) {
                    clearInterval(interval);
                    countdownElement.textContent = "Concluído! Atualizando a página...";
                    
                    // Tentar recarregar a página principal após o término do contador
                    setTimeout(function() {
                        window.location.href = 'index.html';
                    }, 3000);
                    
                    return;
                }
                
                const minutesLeft = Math.floor(totalSeconds / 60);
                const secondsLeft = totalSeconds % 60;
                
                countdownElement.textContent = `${minutesLeft} minutos e ${secondsLeft} segundos`;
            }, 1000);
        }
        
        // Iniciar o contador com 30 minutos (ajuste conforme necessário)
        document.addEventListener('DOMContentLoaded', function() {
            startCountdown(30);
        });
    </script>
</body>
</html>
