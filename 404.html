<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada - Sistema de Gestão de Técnicos e Materiais</title>
    <!-- Importar o arquivo de configuração global -->
    <script src="config.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #43cea2 0%, #185a9d 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        
        .container {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            color: #333;
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #f43f5e;
        }
        
        .error-code {
            font-size: 6rem;
            font-weight: bold;
            margin: 0;
            color: #f43f5e;
            line-height: 1;
        }
        
        p {
            margin: 20px 0;
            font-size: 1.1rem;
            line-height: 1.5;
        }
        
        .button {
            display: inline-block;
            padding: 12px 24px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 500;
            margin-top: 20px;
            transition: background-color 0.2s, transform 0.2s;
        }
        
        .button:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
        }
        
        .button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <p class="error-code">404</p>
        <h1>Página não encontrada</h1>
        <p>A página que você está procurando não existe ou foi movida.</p>
        <p>Verifique se o endereço foi digitado corretamente ou retorne para a página inicial.</p>
        <a href="#" class="button" id="homeButton">Voltar para a página inicial</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Obter a URL base para o link da página inicial
            const baseUrl = window.SITE_CONFIG ? window.SITE_CONFIG.baseUrl : '';
            const homeButton = document.getElementById('homeButton');
            
            // Atualizar o link para a página inicial
            if (homeButton && baseUrl) {
                homeButton.href = baseUrl;
            }
        });
    </script>
</body>
</html>
