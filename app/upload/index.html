<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Foto de Erro - Sistema de Gestão de Técnicos e Materiais</title>
    <link rel="icon" href="../../favicon.ico" />
    <!-- Importar o arquivo de configuração global -->
    <script src="../../config.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #43cea2 0%, #185a9d 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .header {
            background-color: #f9fafb;
            padding: 1.5rem;
            border-bottom: 1px solid #e5e7eb;
            text-align: center;
        }
        
        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #111827;
        }
        
        .header p {
            margin: 0.5rem 0 0;
            color: #6b7280;
            font-size: 0.875rem;
        }
        
        .content {
            padding: 1.5rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #374151;
        }
        
        .form-select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            background-color: white;
            color: #111827;
            font-size: 1rem;
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
        }
        
        .form-textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            background-color: white;
            color: #111827;
            font-size: 1rem;
            resize: vertical;
            min-height: 100px;
        }
        
        .file-upload {
            border: 2px dashed #d1d5db;
            border-radius: 0.375rem;
            padding: 2rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        
        .file-upload:hover {
            border-color: #9ca3af;
        }
        
        .file-upload-icon {
            display: block;
            margin: 0 auto 1rem;
            width: 48px;
            height: 48px;
            color: #9ca3af;
        }
        
        .file-upload-text {
            margin: 0;
            color: #6b7280;
            font-size: 0.875rem;
        }
        
        .file-upload-link {
            color: #2563eb;
            font-weight: 500;
            text-decoration: none;
        }
        
        .file-upload-preview {
            position: relative;
            margin-top: 1rem;
        }
        
        .file-upload-preview img {
            width: 100%;
            border-radius: 0.375rem;
            object-fit: cover;
        }
        
        .file-upload-remove {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 9999px;
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #ef4444;
            border: none;
        }
        
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            background-color: #2563eb;
            color: white;
            border-radius: 0.375rem;
            font-weight: 500;
            text-decoration: none;
            transition: background-color 0.2s;
            border: none;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
        }
        
        .button:hover {
            background-color: #1d4ed8;
        }
        
        .button:disabled {
            background-color: #93c5fd;
            cursor: not-allowed;
        }
        
        .button-icon {
            margin-right: 0.5rem;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            color: white;
            text-decoration: none;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        .back-icon {
            margin-right: 0.25rem;
        }
        
        .success-message {
            text-align: center;
            padding: 2rem;
        }
        
        .success-icon {
            width: 48px;
            height: 48px;
            color: #10b981;
            margin: 0 auto 1rem;
        }
        
        .success-title {
            font-size: 1.25rem;
            color: #111827;
            margin-bottom: 0.5rem;
        }
        
        .success-text {
            color: #6b7280;
            margin-bottom: 1.5rem;
        }
        
        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <a href="../../" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" class="back-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Voltar para a página inicial
    </a>
    
    <div class="container">
        <div class="header">
            <h1>Enviar Foto de Erro</h1>
            <p>Envie uma foto do problema para que o administrador possa analisar</p>
        </div>
        
        <div class="content">
            <form id="uploadForm">
                <div class="form-group">
                    <label for="tecnico" class="form-label">Técnico</label>
                    <select id="tecnico" class="form-select" required>
                        <option value="" disabled selected>Selecione o técnico</option>
                        <option value="Bruno">Bruno</option>
                        <option value="Jarbas">Jarbas</option>
                        <option value="Julio">Julio</option>
                        <option value="Luan">Luan</option>
                        <option value="Matheus">Matheus</option>
                        <option value="Ruan">Ruan</option>
                        <option value="Ryan">Ryan</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="categoria" class="form-label">Categoria do Problema</label>
                    <select id="categoria" class="form-select" required>
                        <option value="" disabled selected>Selecione a categoria</option>
                        <option value="Equipamento">Equipamento</option>
                        <option value="Instalação">Instalação</option>
                        <option value="Material">Material</option>
                        <option value="Ferramenta">Ferramenta</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="descricao" class="form-label">Descrição do Problema</label>
                    <textarea id="descricao" class="form-textarea" placeholder="Descreva o problema em detalhes..." required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="foto" class="form-label">Foto do Problema</label>
                    <input type="file" id="foto" accept="image/*" style="display: none;" required>
                    <div class="file-upload" id="fileUploadArea">
                        <svg class="file-upload-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                        <p class="file-upload-text">
                            <span class="file-upload-link">Clique para selecionar</span> ou arraste e solte
                        </p>
                        <p class="file-upload-text">PNG, JPG, GIF até 10MB</p>
                    </div>
                    <div class="file-upload-preview" id="previewContainer" style="display: none;">
                        <img id="imagePreview" src="#" alt="Preview">
                        <button type="button" class="file-upload-remove" id="removeImage">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="button" id="submitButton" disabled>
                    <svg class="button-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    Enviar Foto
                </button>
            </form>
            
            <div class="success-message" id="successMessage" style="display: none;">
                <svg class="success-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                <h2 class="success-title">Upload realizado com sucesso!</h2>
                <p class="success-text">O administrador foi notificado e analisará sua foto em breve.</p>
                <button type="button" class="button" id="newUploadButton">Enviar outra foto</button>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('uploadForm');
            const fileInput = document.getElementById('foto');
            const fileUploadArea = document.getElementById('fileUploadArea');
            const previewContainer = document.getElementById('previewContainer');
            const imagePreview = document.getElementById('imagePreview');
            const removeImageButton = document.getElementById('removeImage');
            const submitButton = document.getElementById('submitButton');
            const successMessage = document.getElementById('successMessage');
            const newUploadButton = document.getElementById('newUploadButton');
            
            // Verificar se todos os campos estão preenchidos
            function checkFormValidity() {
                const tecnico = document.getElementById('tecnico').value;
                const categoria = document.getElementById('categoria').value;
                const descricao = document.getElementById('descricao').value;
                const foto = fileInput.files.length > 0;
                
                submitButton.disabled = !(tecnico && categoria && descricao && foto);
            }
            
            // Adicionar evento de clique na área de upload
            fileUploadArea.addEventListener('click', function() {
                fileInput.click();
            });
            
            // Adicionar evento de arrastar e soltar
            fileUploadArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                fileUploadArea.style.borderColor = '#2563eb';
            });
            
            fileUploadArea.addEventListener('dragleave', function() {
                fileUploadArea.style.borderColor = '#d1d5db';
            });
            
            fileUploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                fileUploadArea.style.borderColor = '#d1d5db';
                
                if (e.dataTransfer.files.length) {
                    fileInput.files = e.dataTransfer.files;
                    handleFileSelect();
                }
            });
            
            // Lidar com a seleção de arquivo
            fileInput.addEventListener('change', handleFileSelect);
            
            function handleFileSelect() {
                if (fileInput.files.length) {
                    const file = fileInput.files[0];
                    
                    // Verificar se é uma imagem
                    if (!file.type.startsWith('image/')) {
                        alert('Por favor, selecione um arquivo de imagem.');
                        return;
                    }
                    
                    // Verificar o tamanho (10MB)
                    if (file.size > 10 * 1024 * 1024) {
                        alert('O arquivo é muito grande. O tamanho máximo é 10MB.');
                        return;
                    }
                    
                    // Mostrar preview
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        imagePreview.src = e.target.result;
                        fileUploadArea.style.display = 'none';
                        previewContainer.style.display = 'block';
                    };
                    reader.readAsDataURL(file);
                }
                
                checkFormValidity();
            }
            
            // Remover imagem
            removeImageButton.addEventListener('click', function() {
                fileInput.value = '';
                imagePreview.src = '#';
                fileUploadArea.style.display = 'block';
                previewContainer.style.display = 'none';
                checkFormValidity();
            });
            
            // Verificar validade do formulário quando os campos mudam
            document.getElementById('tecnico').addEventListener('change', checkFormValidity);
            document.getElementById('categoria').addEventListener('change', checkFormValidity);
            document.getElementById('descricao').addEventListener('input', checkFormValidity);
            
            // Lidar com o envio do formulário
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Simular envio
                submitButton.disabled = true;
                submitButton.innerHTML = '<svg class="button-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle></svg> Enviando...';
                
                // Simular atraso de rede
                setTimeout(function() {
                    form.style.display = 'none';
                    successMessage.style.display = 'block';
                    
                    // Simular armazenamento local
                    try {
                        const baseUrl = window.SITE_CONFIG ? window.SITE_CONFIG.baseUrl : '../../';
                        const storagePrefix = window.SITE_CONFIG && window.SITE_CONFIG.storage ? window.SITE_CONFIG.storage.prefix : 'rlc_almox_';
                        
                        // Obter dados do formulário
                        const tecnico = document.getElementById('tecnico').value;
                        const categoria = document.getElementById('categoria').value;
                        const descricao = document.getElementById('descricao').value;
                        
                        // Criar objeto de arquivo simulado
                        const fileData = {
                            id: `file-${Date.now()}-${Math.random().toString(36).substring(2, 9)}`,
                            name: fileInput.files[0].name,
                            size: fileInput.files[0].size,
                            type: fileInput.files[0].type,
                            url: imagePreview.src,
                            tecnico: tecnico,
                            categoria: categoria,
                            descricao: descricao,
                            data: new Date().toLocaleDateString('pt-BR'),
                            status: 'novo'
                        };
                        
                        // Obter arquivos existentes
                        const storageKey = `${storagePrefix}shared_files`;
                        let files = [];
                        try {
                            const existingFiles = localStorage.getItem(storageKey);
                            if (existingFiles) {
                                files = JSON.parse(existingFiles);
                            }
                        } catch (error) {
                            console.error('Erro ao carregar arquivos existentes:', error);
                        }
                        
                        // Adicionar novo arquivo
                        files.push(fileData);
                        
                        // Salvar no localStorage
                        localStorage.setItem(storageKey, JSON.stringify(files));
                        
                        // Disparar evento de armazenamento
                        window.dispatchEvent(new Event('storage'));
                    } catch (error) {
                        console.error('Erro ao salvar arquivo:', error);
                    }
                }, 1500);
            });
            
            // Botão para enviar nova foto
            newUploadButton.addEventListener('click', function() {
                form.reset();
                fileUploadArea.style.display = 'block';
                previewContainer.style.display = 'none';
                form.style.display = 'block';
                successMessage.style.display = 'none';
                submitButton.disabled = true;
                submitButton.innerHTML = '<svg class="button-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="current  width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg> Enviar Foto';
            });
        });
    </script>
</body>
</html>
