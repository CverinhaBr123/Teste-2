<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando...</title>
    <!-- Importar o arquivo de configuração global -->
    <script src="config.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #43cea2 0%, #185a9d 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        
        .loader {
            border: 6px solid rgba(255, 255, 255, 0.3);
            border-top: 6px solid #3b82f6;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 2s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        p {
            margin: 10px 0;
        }
        
        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h2>Redirecionando para a página de arquivos...</h2>
    <p>Se você não for redirecionado automaticamente, clique no botão abaixo:</p>
    <a href="#" class="button" id="homeButton">Voltar para a página inicial</a>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Obter a URL base para o link da página inicial
            const baseUrl = window.SITE_CONFIG ? window.SITE_CONFIG.baseUrl : '';
            const homeButton = document.getElementById('homeButton');
            
            // Atualizar o link para a página inicial
            if (homeButton && baseUrl) {
                homeButton.href = baseUrl;
            }
            
            // Redirecionar para a página principal após um breve atraso
            setTimeout(function() {
                window.location.href = baseUrl || 'index.html';
            }, 1500);
        });
    </script>
</body>
</html>
